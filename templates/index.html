<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>First Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="card">
        <div class="icon">👋</div>
        <h1>Selamat Datang</h1>
        <p class="subtitle">Belajar Flask dengan method POST</p>

        <form action="{{ url_for('submit') }}" method="POST">
            <label for="nama">Nama Kamu</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama disini..." autocomplete="off" required>
            <button type="submit">Kirim</button>
        </form>

        {% if nama %}
        <div class="hasil">
            <span class="badge">Hasil</span>
            <p>Halo, <strong>{{ nama }}</strong>! 🎉</p>
            <small>Data berhasil diterima lewat method POST.</small>
        </div>
        {% endif %}
    </main>
</body>
</html>
